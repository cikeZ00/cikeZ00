<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="Terminal shutdown footer"><title>Terminal shutdown footer</title><style>
:root{--bg:transparent;--paper:#2c2b26;--muted:#6c675c;--gold:#8a7c5e;--dim:#cfc9ba;
--ink:rgba(20,20,18,.06);--grid:rgba(30,28,24,.12)}
.g-top{stop-color:#cbbd9f}.g-bot{stop-color:#877b63}
.b-top{stop-color:#b6a98b}.b-bot{stop-color:#6b6353}
@media (prefers-color-scheme:dark){:root{--paper:#d8d3c4;--muted:#827f76;--gold:#c9bea4;
--dim:#3a3730;--ink:#171717;--grid:rgba(185,176,156,.08)}
.g-top{stop-color:#f0e9d8}.g-bot{stop-color:#9c9077}
.b-top{stop-color:#c9bea4}.b-bot{stop-color:#6d6758}}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style><defs><linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop class="g-top"/><stop offset="1" class="g-bot"/></linearGradient><linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop class="b-top"/><stop offset="1" class="b-bot"/></linearGradient><filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#b9b09c" stroke-opacity=".07"/></pattern><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" fill-opacity=".22"/></pattern></defs><rect width="1200" height="120" style="fill:var(--bg)"/><rect width="1200" height="120" fill="url(#grid)"/><path d="M0 1H1200" style="stroke:var(--gold)" stroke-opacity=".5"/><text x="28" y="40" font-size="13" style="fill:var(--paper)" letter-spacing="4">END OF TRANSMISSION</text><g><text x="1172" y="40" text-anchor="end" font-size="13" style="fill:var(--gold)" letter-spacing="4">GLORY TO MANKIND</text><animate attributeName="opacity" values="1;1;.25;1;1" keyTimes="0;.86;.9;.94;1" dur="6s" repeatCount="indefinite"/></g><text x="28" y="66" font-size="9" style="fill:var(--muted)" letter-spacing="2">CONNECTION TERMINATING // 543 COMMITS ARCHIVED</text><text x="1172" y="66" text-anchor="end" font-size="9" style="fill:var(--muted)" letter-spacing="2">ARCHIVE WRITE PROTECTED</text><rect x="28" y="86" width="1144" height="2" style="fill:var(--dim)"/><rect x="28" y="86" width="0" height="2" fill="url(#gold)"><animate attributeName="width" values="0;1144;1144;0" dur="8s" repeatCount="indefinite"/></rect><path d="M28 101L31 104L28 107L25 104Z" style="fill:var(--gold)"><animate attributeName="opacity" values="1;.18;1" dur="1.3s" repeatCount="indefinite"/></path><text x="40" y="107" font-size="9" style="fill:var(--muted)" letter-spacing="2">POD 042 // SHUTDOWN SEQUENCE</text><text x="1172" y="107" text-anchor="end" font-size="9" style="fill:var(--gold)" letter-spacing="3">...</text></svg>