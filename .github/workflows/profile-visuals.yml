name: Build animated profile

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"
  push:
    paths:
      - "scripts/generate_visuals.py"
      - ".github/workflows/profile-visuals.yml"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate animated SVG scenes with live commit stats
        run: python3 scripts/generate_visuals.py --output dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: ${{ github.repository_owner }}

      - name: Publish animations to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
